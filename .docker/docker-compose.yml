# Example commands:
#   1. Launch GPBSF interactive demo container:
#      PATH_TO_GPBSF="/absolute/path/to/gpbsf" docker compose run gpu
#
#   2. Launch Mamba3D experiment container:
#      PATH_TO_GPBSF="/absolute/path/to/gpbsf" docker compose run mamba3d

x-gpu-common: &gpu-common
  privileged: true
  network_mode: host
  shm_size: '8gb'
  command: /bin/bash
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: 1
            capabilities: [gpu]
  volumes:
    - /tmp/.X11-unix:/tmp/.X11-unix
    - /root/.Xauthority:/root/.Xauthority
    - $PATH_TO_GPBSF:/root/code/gpbsf
  environment:
    QT_X11_NO_MITSHM: 1
    DISPLAY: $DISPLAY
    NVIDIA_VISIBLE_DEVICES: all
    NVIDIA_DRIVER_CAPABILITIES: all

services:
  # GPBSF base image (for SAM interactive demo and PointNet++ baseline)
  gpu:
    <<: *gpu-common
    image: docker.io/beta1scat/gpbsf:1.0
    container_name: gpbsf

  # Mamba3D dedicated image (preconfigured with PyTorch 1.13.1, cu117, and Mamba CUDA kernels)
  mamba3d:
    <<: *gpu-common
    image: docker.io/beta1scat/mamba3d:1.0
    container_name: mamba3d